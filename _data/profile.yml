tagline: "I design money-movement systems: on/off ramps, Lightning settlement, ledgers, and the failure modes that appear when rails disagree."
about: "Backend and systems engineer at Flash, working at the intersection of fintech and Bitcoin infrastructure. The default problem is orchestration: converting local money into Bitcoin (and back), reconciling partners who are slow or silent, and keeping a ledger true when banks, Mobile Money, and Lightning nodes disagree. Earlier I built payment and ERP systems in West Africa, so regulation, payroll data, and operator runbooks are architecture constraints, not afterthoughts. Adjacent to the job: the mathematics behind LLMs and modern AI — probability, optimization, and representation — because those tools will sit next to money systems whether we like it or not."

interests:
  - "Payments orchestration: on-ramps, off-ramps, PSP adapters, and settlement state machines"
  - "Bitcoin and Lightning architecture: UTXO, channels, routing, confirmation risk, wallet ops"
  - "Double-entry ledgers, reconciliation, and asset provisioning under partner latency"
  - "Compliance as schema: KYC fields, screening, FATF travel-rule data, and audit trails"
  - "Mathematics of LLMs and AI: linear algebra, information theory, optimization, and probabilistic inference"

security_focus:
  - "Idempotent money movement so retries never double-credit or double-debit"
  - "Explicit payment state machines across bank, Mobile Money, and Lightning rails"
  - "Hot-wallet policy, confirmation depth, and partner timeout runbooks"
  - "Reconciliation when the processor, the chain, and the internal ledger disagree"

