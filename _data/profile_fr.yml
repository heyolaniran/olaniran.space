tagline: "Je conçois des systèmes de mouvement d'argent : on/off ramps, règlement (settlement) Lightning, ledgers, et les modes de défaillance quand les rails se contredisent."
about: "Actuellement ingénieur backend et systèmes chez Flash, à l'intersection de la fintech et de l'infrastructure Bitcoin. Le problème par défaut est l'orchestration : convertir de la monnaie locale en Bitcoin (et l'inverse), réconcilier des partenaires lents ou silencieux, et tenir un ledger exact quand banques, Mobile Money et nœuds Lightning divergent. Avant cela, systèmes de paiement et d'ERP en Afrique de l'Ouest : régulation, paie et runbooks sont des contraintes d'architecture. En parallèle : j'aime étudier les mathématiques derrière les LLM et l'IA — algèbre, optimisation, inférence — parce que ces outils s'assiéront à côté des systèmes d'argent."

interests:
  - "Lecture - Marc Aurèle, Pythagore, stoïcisme"
  - "Orchestration des paiements : on-ramps, off-ramps, adaptateurs PSP, machines à états de règlement (settlement)"
  - "Architecture Bitcoin et Lightning : UTXO, canaux, routage, risque de confirmation, ops wallet"
  - "Ledgers en partie double, réconciliation, et provisionnement d'actifs sous latence partenaire"
  - "Conformité comme schéma : champs KYC, criblage, règle de voyage (travel rule) du GAFI, pistes d'audit"
  - "Mathématiques des LLM et de l'IA : algèbre linéaire, théorie de l'information, optimisation, inférence"

security_focus:
  - "Mouvement d'argent idempotent : une nouvelle tentative (retry) ne double jamais un crédit ou un débit"
  - "Machines à états explicites entre banque, Mobile Money et Lightning"
  - "Politique de hot wallet, profondeur de confirmations, runbooks de délais d'attente (timeouts) des partenaires"
  - "Réconciliation quand le processeur, la chaîne et le ledger interne divergent"

